<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Hugo César</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #F3EDE0;
    --ink-soft: #C9BBA0;
    --paper: #141110;
    --brown-dark: #3E2C1E;
    --brown-deep: #2A1D13;
    --brown-light: #C9AE8C;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap{ max-width: 480px; }
  .eyebrow{
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    text-transform: lowercase;
    color: var(--brown-light);
    margin-bottom: 20px;
  }
  h1{
    font-family: 'Libre Caslon Text', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.3;
    margin-bottom: 20px;
  }
  p{
    color: var(--ink-soft);
    font-size: 15px;
    margin-bottom: 32px;
  }
  a.btn{
    display: inline-block;
    background: var(--brown-light);
    color: var(--brown-deep);
    font-weight: 600;
    font-size: 13px;
    padding: 13px 26px;
    border-radius: 2px;
    text-decoration: none;
    transition: background 0.2s ease;
  }
  a.btn:hover{ background: #E4D9C4; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">página não encontrada</div>
    <h1>"Nem tudo que se procura está exatamente onde se esperava encontrar."</h1>
    <p>A página que você tentou acessar não existe ou foi movida.</p>
    <a class="btn" href="/">voltar para o início</a>
  </div>
</body>
</html>
